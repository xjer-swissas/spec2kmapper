# Copy OUTSIDE the repository, e.g. /etc/spec2kmapper/amoscentral.toml; chmod 600.
# This example contains no working credentials. Never mount keys from the image.
[amoscentral]
base_url = "https://central.amos-cloud.com"
api_version = "v3"
address = "com.example.spec2kmapper"
password = "REPLACE_WITH_ADDRESS_PASSWORD"
client_id = "REPLACE_WITH_OAUTH_CLIENT_ID"
client_secret = "REPLACE_WITH_OAUTH_CLIENT_SECRET"
state_dir = "/var/lib/amoscentral"
private_key_file = "private-key.pem"
# Include old local keys after a deliberate key rotation to read queued messages.
historical_private_key_files = []
system = "spec2kmapper"
system_version = "2.0.0"
system_productive = false
read_timeout = 35
connect_timeout = 5
max_body_bytes = 26214400

[routing]
export_type_header = "amc_2k5mapper_product_header"
# Service is fixed to com.swiss-as.amos.aim.export_data_source.
# The custom header selects the table.
service_version = "1.0"

[routing.data_source_ids]
# Used only when export_type_header = "".
parts = "parts"
configurations = "configurations"
documents = "documents"

# Tenant administrators assign each tenant's sender address in Connection settings.
