[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amoscentral-client"
version = "0.1.0"
description = "Python AMOScentral messaging client with legacy certificate and V3 public-key support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "cryptography>=42"]

[project.scripts]
amoscentral = "amoscentral.__main__:main"

[tool.setuptools.packages.find]
include = ["amoscentral*"]
